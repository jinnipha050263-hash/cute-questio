.card{
  position:relative; width:min(92vw,620px); padding:34px 24px 30px;
  border:1px solid rgba(255,255,255,.55); border-radius:30px;

}

.yes{background:#fff;color:#8c6374}

.no:active,.yes:active{transform:translateX(8px) rotate(-2deg)}
.heart{position:absolute;font-size:28px;opacity:.75}
.a{top:12px;left:22px} .b{top:15px;right:24px} .c{bottom:14px;left:30px} .d{bottom:12px;right:30px}
.note{margin-top:18px;color:#9a7885;font-size:12px}
</style>

    },
    body: JSON.stringify({
      subject: "คำตอบจากคำถามน่ารัก 💗",
      message: "คำตอบมื้อค่ำที่เลือก: " + answer
    })
  });

  // ไม่ว่าจะเลือกข้อไหน ไปหน้า 4
  showPage4();
}

function showPage4(){
  card.innerHTML = `
    <div style="

      </h1>

  `;

  document.body.style.background = "#111";
}

document.querySelector(".no").onclick = showPage2;
document.querySelector(".yes").onclick = showPage2;

</script>
